<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100f0e">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'nonce-mt-legacy-v1'; script-src 'nonce-mt-legacy-v1'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
  <noscript><meta http-equiv="refresh" content="0;url=https://multiversaltherapy.github.io/"></noscript>
  <title>Opening Multiversal Therapy</title>
  <style nonce="mt-legacy-v1">
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 20%, rgba(223, 160, 87, 0.18), transparent 25rem), #100f0e;
      color: #f4eee6;
      text-align: center;
    }
    main { width: min(100%, 460px); }
    .mark {
      display: grid;
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;
      place-items: center;
      border: 2px solid #dfa057;
      border-radius: 50%;
      color: #f4eee6;
      font-family: ui-serif, Georgia, serif;
      font-size: 2rem;
      font-weight: 700;
      box-shadow: 0 0 36px rgba(223, 160, 87, 0.16);
    }
    h1 { margin: 0; font-size: 1.55rem; }
    p { margin: 12px 0 0; color: #aba79f; line-height: 1.55; }
    a {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      margin-top: 24px;
      padding: 12px 20px;
      border: 1px solid #dfa057;
      border-radius: 14px;
      background: rgba(223, 160, 87, 0.1);
      color: #f4eee6;
      font-weight: 800;
      text-decoration: none;
    }
    a:focus-visible { outline: 3px solid #f0c17f; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">M</div>
    <h1 id="headline">Opening Multiversal Therapy…</h1>
    <p id="message">If the page does not open automatically, use the button below.</p>
    <a id="continue-link" href="https://multiversaltherapy.github.io/">Continue</a>
  </main>
  <script nonce="mt-legacy-v1">
    (() => {
      "use strict";

      const rootUrl = "https://multiversaltherapy.github.io/";
      const videoId = new URLSearchParams(window.location.search).get("v") || "";
      const hasVideo = /^[A-Za-z0-9_-]{11}$/.test(videoId);
      const destination = hasVideo
        ? "https://www.youtube.com/watch?v=" + encodeURIComponent(videoId)
        : rootUrl;
      const link = document.getElementById("continue-link");

      link.href = destination;
      link.textContent = hasVideo ? "Watch on YouTube" : "Open Multiversal Therapy";

      window.setTimeout(() => {
        window.location.replace(destination);
      }, 160);
    })();
  </script>
</body>
</html>
