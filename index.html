<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'nonce-c216-v3'; style-src 'nonce-c216-v3'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>Opening YouTube</title>

  <style nonce="c216-v3">
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: Canvas;
      color: CanvasText;
    }

    main {
      width: min(92vw, 520px);
      padding: 36px 20px;
      text-align: center;
    }

    .logo {
      width: 74px;
      height: 52px;
      margin: 0 auto 22px;
      border-radius: 15px;
      background: #ff0000;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 27px;
      line-height: 1;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.7rem;
    }

    p {
      margin: 0 0 24px;
      line-height: 1.55;
      opacity: .76;
    }

    a {
      display: block;
      width: 100%;
      padding: 17px 18px;
      border-radius: 14px;
      font: inherit;
      font-weight: 750;
      text-decoration: none;
    }

    #openApp {
      background: #ff0000;
      color: white;
      border: 1px solid #ff0000;
    }

    #error {
      display: none;
    }

    small {
      display: block;
      margin-top: 20px;
      line-height: 1.45;
      opacity: .55;
    }
  </style>
</head>

<body>
<main>
  <section id="ready">
    <div class="logo">▶</div>
    <h1 id="headline">Opening YouTube…</h1>
    <p id="message">
      If the YouTube app does not open automatically, tap the button below.
    </p>

    <a id="openApp" href="#" rel="external">
      Open in YouTube
    </a>

    <small>
      Secure redirect. No login, cookies, tracking, or personal data collection.
    </small>
  </section>

  <section id="error">
    <h1>Invalid video link</h1>
    <p>The URL does not contain a valid YouTube video ID.</p>
  </section>
</main>

<script nonce="c216-v3">
(() => {
  "use strict";

  const params = new URLSearchParams(window.location.search);
  const videoId = params.get("v") || "";
  const isValidVideoId = /^[A-Za-z0-9_-]{11}$/.test(videoId);

  const ready = document.getElementById("ready");
  const error = document.getElementById("error");
  const openApp = document.getElementById("openApp");
  const headline = document.getElementById("headline");

  if (!isValidVideoId) {
    ready.style.display = "none";
    error.style.display = "block";
    return;
  }

  const encodedId = encodeURIComponent(videoId);
  const webUrl = "https://www.youtube.com/watch?v=" + encodedId;

  const ua = navigator.userAgent || "";
  const isAndroid = /Android/i.test(ua);
  const isIOS =
    /iPhone|iPad|iPod/i.test(ua) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  let appUrl = webUrl;

  if (isAndroid) {
    // No browser_fallback_url:
    // if Chrome blocks the automatic external-app launch,
    // the user stays on this page instead of being sent to YouTube Web.
    appUrl =
      "intent://www.youtube.com/watch?v=" + encodedId +
      "#Intent;scheme=https;package=com.google.android.youtube;end";
  } else if (isIOS) {
    // Best-effort custom scheme. If the WebView blocks it,
    // the manual button remains available.
    appUrl = "youtube://www.youtube.com/watch?v=" + encodedId;
  }

  openApp.href = appUrl;

  // Best-effort automatic launch.
  // Browsers/WebViews may block this because the new page itself
  // has not received a user gesture.
  window.setTimeout(() => {
    try {
      window.location.href = appUrl;
    } catch (_) {
      // Stay on the fallback page.
    }
  }, 120);

  window.setTimeout(() => {
    headline.textContent = "Open in YouTube";
  }, 1400);
})();
</script>
</body>
</html>
